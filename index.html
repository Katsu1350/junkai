<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="巡回管理">
<title>巡回管理</title>
<!-- 地図表示: Leaflet(1.9.4) と 国土地理院/OpenStreetMap のタイル。地図を開いたときだけ表示範囲のタイル取得が外部に送られます -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a25;--sub:#5d6b66;--line:#d5dcd8;--main:#1f6f5c;--done:#e3f1ea;--warn:#b4531f}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2522;--ink:#e8efec;--sub:#9aa9a3;--line:#33403b;--main:#4fb89d;--done:#1d3329;--warn:#e08a55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:8px 0}
h2{font-size:17px;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card.done{background:var(--done)}
.next{border:2px solid var(--main)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,select,.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.p{background:var(--main);color:#fff;border-color:var(--main)}
button.on{background:var(--main);color:#fff;border-color:var(--main)}
button.ng.on{background:var(--warn);border-color:var(--warn)}
select{width:100%}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center}.stats b{display:block;font-size:24px}
.sub{color:var(--sub);font-size:14px}
.hide{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a.btn{text-decoration:none}
.btn.p{background:var(--main);color:#fff;border-color:var(--main)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);vertical-align:2px}
.badge.ok{background:var(--main);border-color:var(--main);color:#fff}
#mapv{display:flex;flex-direction:column;overflow:hidden;z-index:2000;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#mapv.hide{display:none}
#map{flex:1;min-height:0}
.pin{width:30px;height:30px;border-radius:50%;background:#d64545;color:#fff;font:bold 13px/26px sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.pin.done{background:#2f6fd6}.pin.sel{outline:3px solid #ffd23f;font-size:15px}.pin.fx{border-style:dashed}.pin.stn{background:#444;font-size:12px}
label.btn{display:inline-block}
</style>
</head>
<body>
<main id="app"></main>
<div id="mapv" class="modal hide">
 <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px"><b>地図で確認</b><select id="maplayer" style="width:auto;padding:6px" onchange="setLayer(this.value)"><option value="std">地理院 標準</option><option value="pale">地理院 淡色</option><option value="photo">航空写真</option><option value="osm">OpenStreetMap</option></select><button onclick="closeMap()">閉じる</button></div>
 <div id="map"></div>
 <div style="padding:8px 12px"><div id="mapinfo" class="sub"></div>
  <div class="row"><button onclick="resetAllDone()">すべて未巡回に戻す</button><button id="fixbtn" onclick="toggleFix()">位置を直す</button><button id="mundo" onclick="mapUndo()">最後を取り消す</button><button id="mclr" onclick="mapSel=[];mapLast=null;drawMap()">クリア</button><button id="msave" class="p" onclick="saveMap()">この順で決定</button></div></div>
</div>
<script>
/* ============================================================
 * 巡回管理アプリ（個人利用）
 * 【データの取り扱い】
 *  - 住所を含むデータはこの端末のブラウザ(localStorage)にのみ保存されます。サーバー送信はありません。
 *  - 写真ファイルは保存せず、「撮影したか」の状態のみ保存します。
 *  - 端末共有時やSafariの履歴/サイトデータ削除でデータが消える/見られる可能性があります。
 *    バックアップJSONには住所が含まれるため、保管先・送付先に注意してください。
 *  - 地点情報(SPOTS_KEY)と巡回記録(RECORDS_KEY)は別キーで管理し、CSV再読込でも記録を保持します。
 * ============================================================ */
const SPOTS_KEY='patrol.spots.v1', RECORDS_KEY='patrol.records.v1', PREF_KEY='patrol.pref.v1', GEO_KEY='patrol.geo.v2', ROUTES_KEY='patrol.routes.v1', FIX_KEY='patrol.fixes.v1';
const DIRS=['正面','右側','左側','裏面'], PHOTO=['未確認','撮影済み','撮影不可'], CLEAN=['未確認','清掃済み','清掃不要'];
const TRAVEL_MODES={driving:'車',walking:'徒歩',transit:'公共交通',bicycling:'自転車'}; // 拡張しやすい移動モード定義
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let spots=load(SPOTS_KEY,[]);           // [{id,name,address,area,num,order}]  固定情報のみ
let records=load(RECORDS_KEY,{});       // {id:{history:[YYYY-MM-DD],clean,photos:[..4],memo}}
let editList=null;                      // 手動ルート編集中の一時データ [{id,on}]
let fixes=load(FIX_KEY,{});             // 手動修正 {id:{address?,orig?,lat?,lng?}} CSV再読込でも保持
const gk=s=>(pref.pre?.[s.area]||'')+s.address; // 座標キャッシュのキー（地名補完込み）
const pos=s=>fixes[s.id]?.lat!=null?fixes[s.id]:geo[gk(s)]; // 手動補正した位置を優先
function applyFixes(){spots.forEach(s=>{const f=fixes[s.id];if(f?.address)s.address=f.address})}
let geo=load(GEO_KEY,{});               // 住所→座標のキャッシュ（ルート作成用。外部APIで取得）
let routes=load(ROUTES_KEY,{});
applyFixes();         // {エリア:{station,order:[id],km,miss,at}} 最適化した巡回順
let pref=Object.assign({area:'',pre:{},mode:'bicycling',onlyUnvisited:false,detail:null},load(PREF_KEY,{}));
const savePref=()=>save(PREF_KEY,pref);
if(!pref.v2){pref.mode='bicycling';pref.v2=1;savePref()} // 初期値を自転車に
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rec=id=>records[id]||(records[id]={history:[],done:false,clean:0,photos:[0,0,0,0],memo:''});
// 巡回済み状態（done）。日付に関係なく、「未巡回に戻す」まで保持される。履歴(history)は別に残る。
const doneToday=id=>!!records[id]?.done;
function migrateDone(){let ch=false;Object.values(records).forEach(r=>{if(r.done===undefined){r.done=(r.history||[]).includes(today());ch=true}});if(ch)save(RECORDS_KEY,records)}
migrateDone();
const everDone=id=>(records[id]?.history||[]).length>0;
// 「未完了」＝今日未巡回（巡回周期の再開用）。履歴は消さず日付を追加するだけ。
const pending=id=>!doneToday(id);

/* ---- CSV ---- */
function parseCSV(text){
  const rows=[];let r=[],c='',q=false;text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch=='"'){if(text[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true; else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&text[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()));
}
function importCSV(text,silent){
  const rows=parseCSV(text).map(r=>r.map(v=>v.trim()));
  if(rows.length&&/識別番号|id/i.test(rows[0][0]))rows.shift();
  const list=[];const seen=new Set();
  rows.forEach(r=>{const id=r[0];if(!id||seen.has(id))return;seen.add(id);
    const m=id.match(/^(.*?)[-－ー‐](\d+)$/);
    list.push({id,name:r[1]||'',address:r[2]||'',area:m?m[1]:id,num:m?+m[2]:null,order:list.length})});
  if(!list.length){alert('読み込める行がありません。');return}
  const old=new Set(spots.map(s=>s.id)), keep=list.filter(s=>old.has(s.id)).length;
  if(!silent&&!confirm(`${list.length}地点を読み込みます（既存と一致:${keep}件）。\n巡回記録は消えません。続けますか？`))return;
  spots=list;applyFixes();save(SPOTS_KEY,spots);render();
}

/* ---- ナビ（住所のみ。緯度経度は不使用） ---- */
function navURL(s){
  // Google Maps Directions URL。origin省略=現在地。iPhoneはGoogleマップアプリがあればアプリで、無ければSafariで開く。
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(fixes[s.id]?.lat!=null?fixes[s.id].lat+','+fixes[s.id].lng:((pref.pre?.[s.area]||'')+headAddr(s)||s.name))+'&travelmode='+pref.mode;
}

/* ---- 操作 ---- */
function toggleDone(id){
  const r=rec(id),t=today();
  if(r.done){r.done=false;const i=r.history.indexOf(t);if(i>=0)r.history.splice(i,1)} // 取り消し
  else{r.done=true;if(!r.history.includes(t)){r.history.push(t);r.history.sort().reverse()}}
  save(RECORDS_KEY,records);render()}
function setClean(id,v){rec(id).clean=v;save(RECORDS_KEY,records);render()}
function setPhoto(id,i,v){rec(id).photos[i]=v;save(RECORDS_KEY,records);render()}
function allPhotos(id){rec(id).photos=[1,1,1,1];save(RECORDS_KEY,records);render()}
function setMemo(id,v){rec(id).memo=v;save(RECORDS_KEY,records)}

/* ---- CSV登録（CSVの中身を貼り付け。ファイルはGitHubに置かない） ---- */
function importCSVText(){
  const t=document.getElementById('csvin').value;
  if(!t.trim()){alert('CSVの文字列を貼り付けてください。');return}
  importCSV(t);
}

/* ---- バックアップ（クリップボードの文字列） ---- */
function backupText(){return JSON.stringify({version:2,exportedAt:new Date().toISOString(),spots,records,routes,fixes,pre:pref.pre})}
async function copyBackup(){
  const t=backupText();
  try{await navigator.clipboard.writeText(t);alert('バックアップをクリップボードにコピーしました。メモアプリなどに貼り付けて保管してください。')}
  catch(e){const b=document.getElementById('bk');b.value=t;b.focus();b.select();b.setSelectionRange(0,t.length);alert('自動コピーできませんでした。表示された文字列を全選択してコピーしてください。')}
}
function restoreBackup(){
  const t=document.getElementById('bk').value.trim();
  try{const d=JSON.parse(t);if(!Array.isArray(d.spots)||typeof d.records!=='object')throw 0;
    if(!confirm('現在のデータをバックアップの内容で置き換えます。よろしいですか？'))return;
    spots=d.spots;records=d.records;migrateDone();routes=d.routes||{};fixes=d.fixes||{};save(FIX_KEY,fixes);pref.pre=d.pre||{};savePref();applyFixes();
    save(SPOTS_KEY,spots);save(RECORDS_KEY,records);save(ROUTES_KEY,routes);render();alert('復元しました。');
  }catch(e){alert('バックアップの文字列が正しくありません。全体をコピーできているか確認してください。')}
}

/* ---- 最適ルート（駅→最近傍法＋2-opt） ----
 * 注意: ルート作成時のみ、住所を国土地理院の住所検索API、駅名をOpenStreetMap(Nominatim)、
 *       最寄り駅をHeartRails Express APIへ送信します。座標は端末内にキャッシュされます。
 * 距離は直線距離での近似です（実際の自転車ルートではありません）。 */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 住所の整形：全角数字→半角、漢数字の丁目→算用数字、「先」「及び…」や建物名など後ろの説明を除く */
const toHalf=t=>t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/(\d)[ー－‐―−](?=\d)/g,'$1-');
function kanjiNum(k){const d={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};let n=0,t=0;for(const c of k){if(c==='十'){n+=(t||1)*10;t=0}else t=d[c]||0}return n+t}
function headAddr(s){return s.address.split(/[\s　]/)[0].replace(/(及び|および|、|，|／).*$/,'').replace(/先$/,'').replace(/番$/,'')||s.address}
// 同じ町名が全国にあるため、エリアごとの地名（例：東京都千代田区）を頭に付け、結果にもその地名が含まれるものだけ採用する
async function geocode(s){
  const pre=pref.pre?.[s.area]||'';
  const head=headAddr(s),hf=toHalf(head);
  const ar=hf.replace(/([一二三四五六七八九十]+)丁目/,(m,k)=>kanjiNum(k)+'丁目');
  const cands=[...new Set([ar,hf,head,ar.replace(/(丁目\d+).*$/,'$1'),ar.replace(/丁目.*$/,'丁目')].filter(x=>x).map(x=>pre+x))];
  for(const q of cands){
    try{const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));
      const hit=(await r.json()).find(x=>!pre||(x.properties?.title||'').includes(pre));
      if(hit){const c=hit.geometry.coordinates;return{lat:c[1],lng:c[0]}}}catch(e){}
    await sleep(100);
  }
  return null;
}
async function stationByName(name){
  const q=/駅$/.test(name)?name:name+'駅';
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q));
  const j=await r.json();if(!j[0])throw new Error('駅が見つかりません: '+q);
  return{name:q,lat:+j[0].lat,lng:+j[0].lon};
}
async function nearestStation(c){
  const r=await fetch(`https://express.heartrails.com/api/json?method=getStations&x=${c.lng}&y=${c.lat}`);
  const st=(await r.json()).response.station?.[0];if(!st)throw new Error('最寄り駅を取得できませんでした。駅名を入力してください。');
  return{name:st.name+'駅',lat:+st.y,lng:+st.x};
}
function dist(a,b){const R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function optimize(start,items,loop){
  const rest=items.slice(),P=[{p:start}];
  while(rest.length){const cur=P[P.length-1].p;let bi=0,bd=Infinity;
    rest.forEach((x,i)=>{const d=dist(cur,x.p);if(d<bd){bd=d;bi=i}});P.push(rest.splice(bi,1)[0])}
  for(let k=0,imp=true;imp&&k<100;k++){imp=false;
    for(let i=1;i<P.length-1;i++)for(let j=i+1;j<P.length;j++){
      const a=P[i-1].p,b=P[i].p,c=P[j].p,d=P[j+1]?.p||(loop?start:null);
      if(dist(a,b)+(d?dist(c,d):0)-dist(a,c)-(d?dist(b,d):0)>1e-9){P.splice(i,j-i+1,...P.slice(i,j+1).reverse());imp=true}}}
  return P.slice(1);
}
const stationNav=st=>'https://www.google.com/maps/dir/?api=1&destination='+st.lat+','+st.lng+'&travelmode='+pref.mode;
function planNo(sp){const p=routes[sp.area]?.plan;const i=p&&p.at===today()?p.ids.indexOf(sp.id):-1;return i<0?'':`<span class="badge">巡回${i+1}</span>`}
// 巡回プラン：未巡回の地点から基点駅に近い順にN軒を選び、駅→各地点→駅の往復で巡回順を最適化する
async function makePlan(){
  const a=pref.area;if(!a||window._busy)return;window._busy=1;
  const st=t=>{const e=document.getElementById('st');if(e)e.textContent=t};
  try{
    const list=ordSpots().filter(s=>s.area===a),miss=[];
    for(let i=0;i<list.length;i++){const s=list[i];st(`住所を位置情報に変換中 ${i+1}/${list.length}`);
      if(!pos(s)){const p=await geocode(s);if(p){geo[gk(s)]=p;save(GEO_KEY,geo);await sleep(150)}}
      if(!pos(s))miss.push(s.id)}
    const items=list.filter(s=>pos(s)).map(s=>({id:s.id,p:pos(s)}));
    if(!items.length)throw new Error('住所を位置情報に変換できませんでした。');
    const manual=(document.getElementById('stn').value||'').trim();
    st('基点の駅を探しています…');
    const c={lat:items.reduce((t,x)=>t+x.p.lat,0)/items.length,lng:items.reduce((t,x)=>t+x.p.lng,0)/items.length};
    const prev=routes[a]?.station;
    const station=(prev&&prev.manual===manual)?prev:(manual?await stationByName(manual):await nearestStation(c));
    const n=+(document.getElementById('cnt').value)||0;
    const cand=items.filter(x=>pending(x.id));
    if(!cand.length)throw new Error('未巡回の地点がありません。');
    const pick=n>0?cand.slice().sort((x,y)=>dist(station,x.p)-dist(station,y.p)).slice(0,n):cand;
    const path=optimize(station,pick,true);
    let km=0,cur=station;path.forEach(x=>{km+=dist(cur,x.p);cur=x.p});km+=dist(cur,station);
    const ids=path.map(x=>x.id);
    routes[a]={station:{name:station.name,lat:station.lat,lng:station.lng,manual},order:[...ids,...list.map(s=>s.id).filter(id=>!ids.includes(id))],plan:{ids,km,at:today()},miss};
    save(ROUTES_KEY,routes);
  }catch(e){alert('ルートを作成できませんでした。\n'+e.message)}
  window._busy=0;render();
}
/* ---- 手動ルート：チェックで回る地点を選び、▲▼で順番を決める（iPhoneで確実に動くようドラッグは使わない） ---- */
function normEdit(){editList=[...editList.filter(e=>e.on),...editList.filter(e=>!e.on)]} // 選択済みを上に（上から巡回順）
function startEdit(){
  const a=pref.area,r=routes[a],pt=r?.plan&&r.plan.at===today();
  editList=ordSpots().filter(s=>s.area===a).map(s=>({id:s.id,on:pt?r.plan.ids.includes(s.id):pending(s.id)}));
  normEdit();render();
}
function editAll(on){editList.forEach(e=>e.on=on);normEdit();render()}
function moveEdit(i,d){const k=editList.filter(x=>x.on).length;const j=Math.max(0,Math.min(k-1,i+d));const [x]=editList.splice(i,1);editList.splice(j,0,x);render()}
// 番号入力：その巡回順に移動（未選択の地点なら選択に追加）。空欄/0なら対象から外す
function setPos(i,v){
  const e=editList[i];v=parseInt(v);
  if(!v||v<1){e.on=false;normEdit();render();return}
  editList.splice(i,1);e.on=true;
  const k=editList.filter(x=>x.on).length;
  editList.splice(Math.min(v-1,k),0,e);normEdit();render();
}
function editHTML(){
  const sp=Object.fromEntries(spots.map(s=>[s.id,s]));
  return `<div class="card"><b>ルートを手動で決める</b>
  <div class="sub">左の番号欄に巡回順を入力するとその順番に移動します（空欄にすると対象から外れます）。▲▼⤒でも動かせます。</div>
  <div class="row"><button onclick="editAll(true)">すべて選択</button><button onclick="editAll(false)">すべて解除</button></div>
  ${editList.map((e,i)=>{const s=sp[e.id]||{};return `<div class="row" style="align-items:center;flex-wrap:nowrap;border-top:1px solid var(--line);padding-top:6px;${e.on?'':'opacity:.6'}">
   <input type="number" inputmode="numeric" min="1" placeholder="–" value="${e.on?i+1:''}" onchange="setPos(${i},this.value)" style="width:58px;flex:none;text-align:center">
   <div style="flex:1;min-width:0"><b>${esc(e.id)}</b> ${esc(s.name)}${doneToday(e.id)?' <span class="badge ok">巡回済み</span>':''}<div class="sub">${esc(s.address)}</div></div>
   ${e.on?`<button onclick="moveEdit(${i},-9999)">⤒</button><button onclick="moveEdit(${i},-1)">▲</button><button onclick="moveEdit(${i},1)">▼</button>`:''}</div>`}).join('')}
  <div class="row"><button class="p" onclick="saveEdit()">このルートで決定</button><button onclick="editList=null;render()">キャンセル</button></div></div>`;
}
function commitPlan(a,on,allIds){
  const r=routes[a]||{},sp=Object.fromEntries(spots.map(s=>[s.id,s]));
  let km=null; // 基点駅があり座標が取得済みなら往復距離の目安を出す
  if(r.station&&on.every(id=>pos(sp[id]||{}))){km=0;let cur=r.station;on.forEach(id=>{const p=pos(sp[id]);km+=dist(cur,p);cur=p});km+=dist(cur,r.station)}
  routes[a]={...r,order:[...on,...allIds.filter(id=>!on.includes(id))],plan:{ids:on,km,at:today(),manual:true}};
  save(ROUTES_KEY,routes);
}
function saveEdit(){
  const a=pref.area,on=editList.filter(e=>e.on).map(e=>e.id);
  if(!on.length){alert('回る地点を1つ以上選んでください。');return}
  commitPlan(a,on,editList.map(e=>e.id));editList=null;render();
}

/* ---- 地図でルートを選ぶ（Leaflet + OpenStreetMap。Googleマップは使わない） ----
 * 印をタップした順が巡回順。もう一度タップすると外れる。 */
let mapFix=false,mapView=false,tileLayer=null;
const TILES={std:['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png','地理院タイル',18],pale:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png','地理院タイル',18],photo:['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg','地理院タイル',18],osm:['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap',19]};
function setLayer(k){pref.tile=k;savePref();if(!mapMap)return;if(tileLayer)mapMap.removeLayer(tileLayer);const t=TILES[k]||TILES.std;tileLayer=L.tileLayer(t[0],{maxNativeZoom:t[2],maxZoom:19,attribution:t[1]}).addTo(mapMap)}
function toggleFix(){mapFix=!mapFix;document.getElementById('fixbtn').classList.toggle('on',mapFix);drawMap()}
function mapResetPos(){const f=fixes[mapLast];if(!f)return;delete f.lat;delete f.lng;if(!f.address)delete fixes[mapLast];save(FIX_KEY,fixes);drawMap()}
let mapSel=[],mapMap=null,mapGroup=null,mapSpots=[],mapAll=[],mapLast=null;
async function ensureGeo(list,st){
  const miss=[];
  for(let i=0;i<list.length;i++){const s=list[i];st(`住所を位置情報に変換中 ${i+1}/${list.length}`);
    if(!pos(s)){const p=await geocode(s);if(p){geo[gk(s)]=p;save(GEO_KEY,geo);await sleep(150)}}
    if(!pos(s))miss.push(s.id)}
  return miss;
}
async function openMap(){
  const a=pref.area;if(window._busy)return;
  if(typeof L==='undefined'){alert('地図ライブラリを読み込めませんでした。ネット接続を確認してください。');return}
  window._busy=1;
  const st=t=>{const e=document.getElementById('gst');if(e)e.textContent=t};
  try{
    const list=ordSpots().filter(s=>!a||s.area===a);
    const miss=await ensureGeo(list,st);st('');
    mapAll=list.map(s=>s.id);mapSpots=list.filter(s=>pos(s));
    if(!mapSpots.length)throw new Error('住所を位置情報に変換できませんでした。');
    const pl=routes[a]?.plan;mapSel=(pl)?pl.ids.filter(id=>mapSpots.some(s=>s.id===id)):[];
    mapLast=null;
    document.getElementById('mapv').classList.remove('hide');
    if(!mapMap){mapMap=L.map('map');mapGroup=L.layerGroup().addTo(mapMap);setLayer(pref.tile||'std')}
    document.getElementById('maplayer').value=pref.tile||'std';
    await sleep(50);mapMap.invalidateSize();
    const pts=mapSpots.map(s=>[pos(s).lat,pos(s).lng]);
    const stn=routes[a]?.station;if(stn)pts.push([stn.lat,stn.lng]);
    mapMap.fitBounds(L.latLngBounds(pts),{padding:[30,30]});
    mapView=!a;['mundo','mclr','msave'].forEach(i=>document.getElementById(i).classList.toggle('hide',mapView));
    drawMap(miss);
  }catch(e){alert('地図を開けませんでした。\n'+e.message)}
  window._busy=0;
}
function drawMap(miss){
  if(miss)window._mapMiss=miss;
  mapGroup.clearLayers();
  const stn=routes[pref.area]?.station,by=Object.fromEntries(mapSpots.map(s=>[s.id,s]));
  const ll=mapSel.filter(id=>by[id]).map(id=>[pos(by[id]).lat,pos(by[id]).lng]);
  if(ll.length){const line=stn?[[stn.lat,stn.lng],...ll,[stn.lat,stn.lng]]:ll;L.polyline(line,{color:'#1f6f5c',weight:4,opacity:.8}).addTo(mapGroup)}
  const icon=(cls,t)=>L.divIcon({className:'',html:`<div class="pin ${cls}">${t}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
  if(stn)L.marker([stn.lat,stn.lng],{icon:icon('stn','駅')}).addTo(mapGroup);
  mapSpots.forEach(s=>{const i=mapSel.indexOf(s.id),p=pos(s),fx=fixes[s.id]?.lat!=null;
    const cls=(mapDone(s)?'done':'')+(i>=0?' sel':'')+(fx?' fx':'');
    L.marker([p.lat,p.lng],{icon:icon(cls,s.num??''),draggable:mapFix})
      .on('click',()=>{if(mapFix){mapLast=s.id;drawMap()}else tapPin(s.id)})
      .on('dragend',e=>{const q=e.target.getLatLng();fixes[s.id]={...fixes[s.id],lat:q.lat,lng:q.lng};save(FIX_KEY,fixes);mapLast=s.id;drawMap()})
      .addTo(mapGroup)});
  const m=window._mapMiss||[],l=mapLast&&by[mapLast];
  const red=mapSpots.filter(x=>!mapDone(x)).length,blue=mapSpots.length-red;
  document.getElementById('mapinfo').innerHTML=`<span style="color:#d64545">●</span>未巡回 ${red}　<span style="color:#2f6fd6">●</span>巡回済み ${blue}　／　黄色い枠＝ルート選択中（${mapSel.length}軒）、数字は識別番号`
    +(mapFix?'<div><b>位置修正モード：</b>印をドラッグして正しい場所へ動かすと自動保存されます（点線の枠は修正済み）。</div>':'')
    +(l?`<div style="color:var(--ink)"><b>${esc(l.id)}</b> ${esc(l.name)}<br>${esc(l.address)}${fixes[l.id]?.lat!=null?' <button onclick="mapResetPos()">位置を元に戻す</button>':''}</div>`:(mapFix?'':(mapView?'<div>印をタップすると地点の情報が表示されます。エリアを選んで開くと、ルートも選べます。</div>':'<div>印をタップした順が巡回順になります。もう一度タップすると外れます。</div>')))
    +(m.length?`<div>位置不明（地図に出ません）：${esc(m.join(', '))}。詳細画面で住所を修正してください。</div>`:'');
}
function mapDone(s){return doneToday(s.id)} // 巡回済みは無条件で青
function tapPin(id){if(mapView){mapLast=id;drawMap();return}const i=mapSel.indexOf(id);if(i>=0)mapSel.splice(i,1);else mapSel.push(id);mapLast=id;drawMap()}
function mapUndo(){mapSel.pop();mapLast=null;drawMap()}
function closeMap(){mapFix=false;document.getElementById('fixbtn').classList.remove('on');document.getElementById('mapv').classList.add('hide')}
function saveMap(){
  if(!mapSel.length){alert('地図の印をタップして、回る地点を選んでください。');return}
  commitPlan(pref.area,mapSel.slice(),mapAll);closeMap();render();
}
/* ---- 住所・位置の修正（CSVとは別に保存し、CSV再登録後も保持する） ---- */
function saveAddr(id){
  const v=document.getElementById('adr').value.trim(),s=spots.find(x=>x.id===id);
  if(!v||!s||v===s.address)return;
  fixes[id]={orig:fixes[id]?.orig??s.address,address:v}; // 住所を変えたら手動の位置調整は破棄（新住所で再取得）
  save(FIX_KEY,fixes);applyFixes();save(SPOTS_KEY,spots);render();
  alert('保存しました。地図・ルート作成のときに新しい住所を座標に変換します。');
}
function resetFix(id){
  const f=fixes[id],s=spots.find(x=>x.id===id);if(f?.orig&&s)s.address=f.orig;
  delete fixes[id];save(FIX_KEY,fixes);save(SPOTS_KEY,spots);render();
}
/* ---- 一覧の検索（入力のたびに表示/非表示を切り替える。全角半角・ハイフン・空白の違いは無視、複数語はAND） ---- */
let searchQ='';
const nz=t=>toHalf(String(t||'')).toLowerCase().replace(/[\s　\-ー－‐―−]/g,'');
function applySearch(){
  const ks=searchQ.split(/[\s　]+/).map(nz).filter(Boolean);let shown=0;
  document.querySelectorAll('#app .grp').forEach(g=>{let any=false;
    g.querySelectorAll('.card[data-s]').forEach(c=>{const ok=ks.every(k=>c.dataset.s.includes(k));c.style.display=ok?'':'none';if(ok){any=true;shown++}});
    g.style.display=any?'':'none'});
  const e=document.getElementById('qc');if(e)e.textContent=ks.length?(shown?`${shown}件が見つかりました`:'見つかりませんでした'):'';
}
// すべて（エリア選択中はそのエリア）の巡回済みを未巡回に戻す。巡回履歴は消さない
function resetAllDone(){
  const sc=spots.filter(x=>!pref.area||x.area===pref.area),n=sc.filter(x=>doneToday(x.id)).length;
  if(!n){alert('巡回済みの地点はありません。');return}
  if(!confirm(`${pref.area?pref.area+'エリア':'すべて'}の巡回済み ${n}件を未巡回に戻します。巡回履歴は残ります。よろしいですか？`))return;
  sc.forEach(x=>{if(records[x.id])records[x.id].done=false});
  save(RECORDS_KEY,records);render();if(mapGroup&&mapSpots.length)drawMap();
}
function setPre(v){pref.pre=pref.pre||{};pref.pre[pref.area]=v.trim();savePref();render()}
function resetRoute(){delete routes[pref.area];save(ROUTES_KEY,routes);render()}
// 表示順：エリアはCSV登場順、エリア内は最適化済みならその順、未作成ならCSV順
function orderIdx(s){const o=routes[s.area]?.order;const i=o?o.indexOf(s.id):-1;return i<0?1e6+s.order:i}
function ordSpots(){const ar=areas();return spots.slice().sort((x,y)=>ar.indexOf(x.area)-ar.indexOf(y.area)||orderIdx(x)-orderIdx(y))}

/* ---- 画面 ---- */
function areas(){return [...new Set(spots.map(s=>s.area))]}
function visible(){let l=ordSpots().filter(s=>!pref.area||s.area===pref.area);
  return pref.onlyUnvisited?l.filter(s=>pending(s.id)):l}
const badge=d=>`<span class="badge ${d?'ok':''}">${d?'巡回済み':'未巡回'}</span>`;
function spotCard(s,isNext){
  const d=doneToday(s.id);
  return `<div class="card ${d?'done':''} ${isNext?'next':''}" ${isNext?'':`data-s="${esc([s.id,s.name,s.address,records[s.id]?.memo].map(nz).join('|'))}"`}>
  <b>${d?'✓ ':''}${esc(s.id)} ${esc(s.name)}</b> ${badge(d)} ${planNo(s)}
  <div class="sub">${esc(s.address)}</div>
  <div class="row">
   <a class="btn" href="${navURL(s)}" target="_blank" rel="noopener">ナビ</a>
   <button class="${d?'on':'p'}" onclick="toggleDone('${esc(s.id)}')">${d?'取り消す':'巡回済みにする'}</button>
   <button onclick="openDetail('${esc(s.id)}')">詳細</button></div></div>`;
}
function openDetail(id){pref.detail=id;savePref();render();scrollTo(0,0)}
function closeDetail(){pref.detail=null;savePref();render()}
function detailHTML(s){
  const r=rec(s.id),d=doneToday(s.id);
  return `<div class="modal"><main>
  <button onclick="closeDetail()">← 戻る</button>
  <h1>${esc(s.id)}</h1><div><b>${esc(s.name)}</b> ${badge(d)}</div><div class="sub">${esc(s.address)}</div>
  <div class="row"><a class="btn p" href="${navURL(s)}" target="_blank" rel="noopener" style="background:var(--main);color:#fff;text-decoration:none">Googleマップでナビ</a>
  <button class="${d?'on':'p'}" onclick="toggleDone('${esc(s.id)}')">${d?'取り消す':'巡回済みにする'}</button></div>
  <h2>住所の修正</h2><input type="text" id="adr" value="${esc(s.address)}">
  <div class="row"><button class="p" onclick="saveAddr('${esc(s.id)}')">住所を保存</button>${fixes[s.id]?`<button onclick="resetFix('${esc(s.id)}')">元の住所・位置に戻す</button>`:''}</div>
  <div class="sub">${fixes[s.id]?.lat!=null?'地図上の位置を手動で調整済みです（ナビは調整した位置へ案内します）。':'保存すると、ナビ・地図はこの住所を使います。'}地図上の位置は「地図で選ぶ」の「位置を直す」で動かせます。</div>
  <h2>清掃</h2><div class="seg">${CLEAN.map((n,i)=>`<button class="${r.clean===i?'on':''}" onclick="setClean('${esc(s.id)}',${i})">${n}</button>`).join('')}</div>
  <h2>写真（撮影状況のみ記録）</h2>
  <button onclick="allPhotos('${esc(s.id)}')">4方向すべて撮影済み</button>
  ${DIRS.map((n,di)=>`<div class="card"><b>${n}</b><div class="seg" style="margin-top:6px">${PHOTO.map((p,pi)=>`<button class="${r.photos[di]===pi?'on':''} ${pi===2?'ng':''}" onclick="setPhoto('${esc(s.id)}',${di},${pi})">${p}</button>`).join('')}</div></div>`).join('')}
  ${r.photos.includes(2)?'<div class="sub">撮影不可の理由は下のメモに書いてください。</div>':''}
  <h2>メモ</h2><textarea rows="4" oninput="setMemo('${esc(s.id)}',this.value)" placeholder="例：裏側に車が停まっていて撮影できなかった">${esc(r.memo)}</textarea>
  <h2>巡回履歴</h2>${r.history.length?r.history.map(h=>`<div>${h.replace(/-/g,'/')}</div>`).join(''):'<div class="sub">まだ履歴がありません</div>'}
  </main></div>`;
}
function render(){
  const app=document.getElementById('app');
  const list=visible(),scope=ordSpots().filter(s=>!pref.area||s.area===pref.area);
  const total=scope.length,dn=scope.filter(s=>doneToday(s.id)).length;
  const pr=pref.area&&routes[pref.area],pt=pr?.plan&&pr.plan.at===today();
  const pp=pt?pr.plan.ids.filter(id=>pending(id)):[];
  const next=pt?(pp.length?scope.find(s=>s.id===pp[0]):null):scope.find(s=>pending(s.id));
  let html=`<h1>巡回管理</h1>
  <div class="card"><div class="stats"><div><b>${total}</b>${pref.area?'エリア地点':'登録地点'}</div><div><b>${dn}</b>巡回済み</div><div><b>${total-dn}</b>未巡回</div></div></div>
  <div class="row" style="margin:0 0 8px"><button class="p" style="flex:1" onclick="openMap()">🗺 地図で確認</button><button style="flex:1" onclick="resetAllDone()">すべて未巡回に戻す</button></div><div class="sub" id="gst"></div>
  <select onchange="pref.area=this.value;editList=null;savePref();render()"><option value="">すべてのエリア</option>${areas().map(a=>`<option ${a===pref.area?'selected':''}>${esc(a)}</option>`).join('')}</select>
  <input type="search" enterkeyhint="search" placeholder="🔍 識別番号・名称・住所・メモで検索" value="${esc(searchQ)}" oninput="searchQ=this.value;applySearch()" style="margin-top:8px"><div class="sub" id="qc"></div>
  <div class="row"><label class="sub"><input type="checkbox" ${pref.onlyUnvisited?'checked':''} onchange="pref.onlyUnvisited=this.checked;savePref();render()"> 未巡回のみ表示（再開）</label>
  <select style="width:auto" onchange="pref.mode=this.value;savePref();render()">${Object.entries(TRAVEL_MODES).map(([k,v])=>`<option value="${k}" ${k===pref.mode?'selected':''}>${v}</option>`).join('')}</select></div>`;
  if(pref.area){const r=routes[pref.area],pl=r?.plan;
    html+=`<div class="card"><b>巡回プラン（${esc(pref.area)}）</b>
    <div class="sub" style="margin-top:6px">住所の頭に付ける地名（都道府県・市区町村）</div><input type="text" value="${esc(pref.pre?.[pref.area]||'')}" placeholder="例：東京都千代田区" onchange="setPre(this.value)">
    ${(!/^(北海道|東京都|京都府|大阪府|.{2,3}県)/.test(scope[0]?.address||'')&&!pref.pre?.[pref.area])?'<div class="sub" style="color:var(--warn)">⚠ 住所に都道府県・市区町村がないため、上の欄に入れないと同じ町名の別の地域（北海道など）に印が付くことがあります。</div>':''}
    <div class="sub">${pl?`${r.station?`基点：${esc(r.station.name)} ／ `:''}${pl.ids.length}軒${pl.km!=null?` ／ 往復の直線距離 約${pl.km.toFixed(1)}km`:''}${pl.manual?' ／ 手動':''}（${pl.at.replace(/-/g,'/')}作成）${r.miss?.length?` ／ 位置不明：${esc(r.miss.join(', '))}`:''}`:'未作成です。現在はCSVの順です。'}</div>
    <div class="row" style="align-items:center"><span class="sub">回る軒数</span><select id="cnt" style="width:auto" onchange="pref.count=+this.value;savePref()">${[3,5,8,10,15,20,30,0].map(v=>`<option value="${v}" ${v===(pref.count??10)?'selected':''}>${v?v+'軒':'すべて'}</option>`).join('')}</select></div>
    <input type="text" id="stn" placeholder="基点の駅名（空欄なら最寄り駅を自動取得）" value="${esc(r?.station?.manual||'')}" style="margin-top:8px">
    <div class="row"><button class="p" onclick="makePlan()">駅から往復ルートを作る</button><button onclick="startEdit()">ルートを手動で決める</button>${r?.station?`<a class="btn" href="${stationNav(r.station)}" target="_blank" rel="noopener">駅へ戻るナビ</a>`:''}${pl?`<button onclick="resetRoute()">CSV順に戻す</button>`:''}</div>
    <div class="sub" id="st"></div></div>${editList?editHTML():''}`}
  else if(spots.length)html+=`<div class="card sub">エリアを選ぶと「巡回プラン」（往復ルート作成・手動ルート）が使えます。「地図で確認」はエリアを選ぶと、印をタップしてルートも選べます。</div>`;
  if(!spots.length)html+=`<div class="card">地点がありません。下の「データ管理」でCSVの中身を貼り付けて登録してください。</div>`;
  if(next)html+=`<h2>【次の目的地】</h2>${spotCard(next,true)}`;
  else if(pt)html+=`<div class="card"><b>🎉 巡回プラン完了</b><div class="sub">最後は駅へ戻りましょう。続けて回る場合は、軒数を選んで再度ルートを作成できます。</div>${pr.station?`<div class="row"><a class="btn p" href="${stationNav(pr.station)}" target="_blank" rel="noopener">${esc(pr.station.name)}へ戻るナビ</a></div>`:''}</div>`;
  else if(total)html+=`<div class="card">🎉 ${pref.area||'すべて'}の巡回が完了しました。</div>`;
  const groups={};list.forEach(s=>(groups[s.area]=groups[s.area]||[]).push(s));
  Object.entries(groups).forEach(([a,l])=>{html+=`<div class="grp"><h2>${esc(a)}エリア <span class="sub">（${l.filter(s=>doneToday(s.id)).length}/${l.length}）</span></h2>`+l.map(s=>spotCard(s,false)).join('')+'</div>'});
  html+=`<h2>データ管理</h2><div class="card">
   <textarea id="csvin" rows="3" placeholder="CSVの中身（識別番号,名称,住所）を貼り付け"></textarea>
   <div class="row"><button class="p" onclick="importCSVText()">貼り付けたCSVで地点を登録</button></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
   <div class="row"><button onclick="copyBackup()">バックアップをコピー</button><button onclick="restoreBackup()">貼り付けた文字列から復元</button></div>
   <textarea id="bk" rows="3" style="margin-top:8px" placeholder="復元するときは、バックアップの文字列をここに貼り付けてください"></textarea>
   <div class="sub" style="margin-top:8px">データはこの端末内のみに保存されます。機種変更前に必ずバックアップをコピーしてメモ等に保管してください。</div></div>`;
  const ds=pref.detail&&spots.find(s=>s.id===pref.detail);
  app.innerHTML=html+(ds?detailHTML(ds):'');applySearch();
}
render();
</script>
</body>
</html>
